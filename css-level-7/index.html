<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-LEVEL-7</title>
    <style>
        @keyframes loading {
            0%{height:20px;
            width:0px;}
            90%{height:20px;
            width:120px;}
            95%{height:20px;
            width:80px;}
            100%{height:20px;
            width:150px}
        }
        #loadingText {
    position: absolute;
    top: 423px;
    left: 669px;
    font-size: xx-large;
}
        #loadingContainer{
            height: 22px;
            width: 152px;
            position: absolute;
            top: 500px;
            left: 650px;
            border-color: black;
            border-style: solid;
        }
        #loading {
    height: 20px;
    width: 150px;
    background-color: black;
    position: absolute;
    top: 503px;
    left: 654px;
    color: white;
    animation: loading 3s ease-in-out 0s 1;
}
    </style>
</head>
<body>
    <div id="loadingContainer"></div>
    <div id="loading"></div>
    <p id="loadingText">Loading...</p>
</body>
</html>
