<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let gender="female";
        let age=4;
        let ticket=50;
        if(age<5){
            ticket=0;
        }else if(age>65){
            ticket=30*(ticket)/100;
        }else if(gender=="female"||age<=8){
            ticket=ticket-(50*(ticket)/100);
        }

        console.log(`You have to pay ${ticket}`);
    </script>
</body>
</html>
