<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
</head>
<body>
    <h1 id="greet"></h1>
    <script>
        let myDate= new Date();
        if(myDate.getHours()>=4 && myDate.getHours()<12){
            document.querySelector('#greet').innerHTML='Good Morning, Anshul';
        }else if(myDate.getHours()>=12 && myDate.getHours()<16){
            document.querySelector('#greet').innerHTML='Good Afternoon, Anshul';
        }else if(myDate.getHours()>=16 && myDate.getHours()<20){
            document.querySelector('#greet').innerHTML='Good Evening, Anshul';
        }else{
            document.querySelector('#greet').innerHTML='Good Night, Anshul';
        }
    </script>
</body>
</html>
