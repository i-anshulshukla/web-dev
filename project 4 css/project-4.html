<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 4 CSS</title>
    <style>
        #div1{
            box-sizing: content-box;
            height: 200px;
            width: 200px;
            padding: 10px;
            margin: 100px;
            background-color: aqua;
        }
        #div2{
             box-sizing: border-box;
            height: 100px;
            width: 100px;
            background-color: green;
        }
        #button{
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            margin: 100px;
            border-radius: 100%;
            border-color: red;
            border-style: dotted;
        }

    </style>
</head>
<body>
    <div id="div1"></div>
    <div id="div2"></div>
    <button id="button">Hello</button>
</body>
</html>
