<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <section>
            <form action="/Form Project (Level 5)/submission.html">
                 <h1><u>Fill the form</u> :</h1>
                 <hr><label for="firstName">First Name *: </label>
                 <input id="firstName" type="text" required placeholder="Enter your first name"><br>
                 <hr><label for="lastName">Last Name * : </label>
                 <input id="lastName" type="text" required placeholder="Enter your last name"><br>
                 <hr><label for="male" > Gender  :   Male</label>
                 <input id="male" type="radio" name="gender">
                 <label for="female" >Female</label>
                 <input id="female" type="radio" name="gender"><br>
                 <hr><label for="mobileNumber">Mobile No : </label>
                 <input id="mobileNumber" type="number" placeholder="Enter 10 digit mobile number"><br>
                 <hr>Date of Birth : <input id="dob" type="date"><br>
                 <hr><label for="image">Image : </label>
                 <input id="image" type="file"><br>
                 <hr><label for="color">Your favorite color : </label>
                 <input id="color" type="color"><br>
                 
                 <hr>Passed : <br>
                 <label for="class10">Class 10th : </label>
                 <input id="class10" type="checkbox"><select>
                    <option value="CBSE">CBSE</option>
                    <option value="ICSE">ICSE</option>
                    <option value="other">Other</option>
                 </select><br>
                 <label for="class12">Class 12th : </label>
                 <input id="class12" type="checkbox"><select>
                    <option value="CBSE">CBSE</option>
                    <option value="ICSE">ICSE</option>
                    <option value="other">Other</option>
                 </select><br><br><hr>
                 <iframe width="300" height="200" src="https://www.youtube.com/embed/rklidcZ-aLU?si=KS-lIvjLy2Ni3K8p" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><br>
                <hr><textarea rows="5" cols="42" placeholder="What did you like msot in the above video ?"></textarea><br>

                 <hr><label for="feedback">Feedback : </label>
                 <input id="feedback" type="range"><br>
                 <br>
                 <hr><input id="submit" type="submit" value="Submit">
            </form>
            <form action="/form.html">
                <br>
                <input  id="button" type="submit" value="Clear form">
            </form>
            
        </section>
</body>
</html>
